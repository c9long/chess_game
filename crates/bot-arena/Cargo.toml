[package]
name = "bot-arena"
description = "Engine-vs-engine tournaments: strength-level calibration, ratings (Bradley-Terry), SPRT and seat-bias statistics."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bot-arena"
path = "src/main.rs"

[dependencies]
bot-engine = { path = "../bot-engine" }
rules-core = { path = "../rules-core" }
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[lints]
workspace = true

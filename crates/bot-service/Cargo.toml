[package]
name = "bot-service"
description = "HTTP bot service wrapping bot-engine: deadline-aware worker pool with load shedding."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bot-engine = { path = "../bot-engine" }
rules-core = { path = "../rules-core" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "server", "http1", "service", "server-graceful"] }
http-body-util = "=0.1.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter", "json", "ansi", "std"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
tokio = { version = "=1.53.3", features = ["io-util"] }

[lints]
workspace = true

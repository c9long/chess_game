# Production stack for one VPS (PLAN §9): Postgres, the game/API server, bot-service and a
# Cloudflare Tunnel (public HTTPS for the API without opening any web ports). The web app is
# static and is served by Cloudflare Pages.
#
#   cp infra/.env.example infra/.env   # fill in every value
#   docker compose -f infra/docker-compose.yml --env-file infra/.env up -d --build
#
# The tunnel is in the "tunnel" profile. infra/.env.example sets COMPOSE_PROFILES=tunnel, so
# production starts it; a local test stack without a tunnel token leaves that line out.
# The server reads its settings from infra/.env, or from the absolute path in GAME_ENV_FILE
# (exported in the shell) for a test stack that keeps its settings elsewhere.
#
# See docs/DEPLOY.md for the full walkthrough.
name: game

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-game}
      POSTGRES_USER: ${DB_USER:-game}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: apply database migrations and seed the civilization catalog, then exit.
  migrate:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    image: game-server
    restart: "no"
    command: ["sh", "-c", "node packages/db/src/migrate-cli.ts && node packages/db/src/seed-cli.ts"]
    environment:
      DATABASE_URL: postgres://${DB_USER:-game}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-game}
    depends_on:
      postgres:
        condition: service_healthy

  server:
    image: game-server
    restart: unless-stopped
    # Running games finish before a restart (PLAN §5 draining deploys); cap matches the server.
    stop_grace_period: 45m
    env_file: ${GAME_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgres://${DB_USER:-game}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-game}
      BOT_SERVICE_URL: http://bot-service:7700
      TRUST_CLOUDFLARE: "true"
      RATE_LIMIT_ENABLED: "true"
    expose:
      - "3000"
    # /api/health also checks the database. The image has no curl; Node's fetch does the job.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      bot-service:
        condition: service_started

  # Bot moves for the game server. CPU-limited so searches can never starve the referee
  # (PLAN §6); BOT_WORKERS follows the CPU limit. Reachable only on the compose network.
  bot-service:
    build:
      context: ..
      dockerfile: crates/bot-service/Dockerfile
    restart: unless-stopped
    cpus: 2
    mem_limit: 512m
    stop_grace_period: 5s
    environment:
      BOT_BIND: 0.0.0.0:7700
      BOT_LOG_FORMAT: json
    expose:
      - "7700"

  # Cloudflare Tunnel: connects outbound to Cloudflare, which serves https://api.<domain>
  # and forwards to http://server:3000 (WebSockets included). The VPS opens no web ports,
  # needs no TLS certificates, and only Cloudflare can reach the server, so the
  # CF-Connecting-IP header the rate limits rely on can be trusted. Setup: docs/DEPLOY.md.
  # Profile "tunnel" (on in production via COMPOSE_PROFILES=tunnel in infra/.env). Without a
  # token cloudflared keeps restarting and its log says "cloudflared tunnel run" requires the
  # ID or name of the tunnel.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.0
    profiles: [tunnel]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Not "${...:?}": Compose interpolates every service, including ones whose profile is
      # off, so a required variable here would break tunnel-less stacks.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:

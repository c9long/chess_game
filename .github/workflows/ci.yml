name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy -p rules-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace --all-features

  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: game
          POSTGRES_PASSWORD: game_dev_password
          POSTGRES_DB: game_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U game -d game_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://game:game_dev_password@localhost:5432/game_test
    steps:
      - uses: actions/checkout@v4
      # The rules engine is built to WebAssembly (packages/rules) before typecheck/tests.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Must match the wasm-bindgen crate version in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: ./.github/actions/setup-binaryen
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          REQUIRE_WASM_OPT: '1'

  # The production images, built and started as docker-compose.yml runs them, on x86 and on
  # ARM (the Oracle Cloud free tier is ARM): the server answers its health check with the
  # database up, and the bot service plays a move.
  stack:
    # Two cold image builds: on pushes to main only, not on every pull request.
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    env:
      GAME_ENV_FILE: ${{ github.workspace }}/stack.env
      COMPOSE: docker compose -p gametest -f infra/docker-compose.yml -f infra/docker-compose.local.yml --env-file ${{ github.workspace }}/stack.env
    steps:
      - uses: actions/checkout@v4
      - name: Test settings
        run: |
          grep -v '^COMPOSE_PROFILES=' infra/.env.example > stack.env
          for key in DB_PASSWORD BETTER_AUTH_SECRET IP_HASH_SECRET; do
            sed -i "s/^$key=.*/$key=$(openssl rand -hex 32)/" stack.env
          done
          for key in TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY RESEND_API_KEY; do
            sed -i "s/^$key=.*/$key=placeholder/" stack.env
          done
      - name: Build and start
        run: $COMPOSE up -d --build --wait --wait-timeout 300
      - name: Server health
        run: curl -fsS http://127.0.0.1:3900/api/health | tee /dev/stderr | grep -q '"db":"ok"'
      - name: Bot move
        run: |
          $COMPOSE exec -T server node --input-type=module -e "
            const { Game, initRules } = await import('/app/packages/rules/src/index.ts')
            await initRules()
            const position = Game.create({ mode: 'ffa' }).positionString()
            const r = await fetch('http://bot-service:7700/v1/move', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ position, level: '1500', clockMs: 60000 }),
            })
            console.log(r.status, await r.text())
            process.exit(r.ok ? 0 : 1)
          "
      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Stop
        if: always()
        run: $COMPOSE down -v

  beta-stack:
    # The $0 beta (docs/DEPLOY-BETA.md): Caddy in front, the web app served by the server, no
    # email accounts. ARM only, like the Oracle machine it runs on; pushes to main only.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    env:
      GAME_ENV_FILE: ${{ github.workspace }}/beta.env
      COMPOSE: docker compose -p gametest -f infra/docker-compose.yml -f infra/docker-compose.beta.yml -f infra/docker-compose.beta-local.yml --env-file ${{ github.workspace }}/beta.env
    steps:
      - uses: actions/checkout@v4
      - name: Test settings
        run: |
          sed 's/^SITE_ADDRESS=.*/SITE_ADDRESS=:80/; s/yourname\.duckdns\.org/beta.example.test/g' \
            infra/beta.env.example > beta.env
          for key in DB_PASSWORD BETTER_AUTH_SECRET IP_HASH_SECRET; do
            sed -i "s/^$key=.*/$key=$(openssl rand -hex 32)/" beta.env
          done
          for key in TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY; do
            sed -i "s/^$key=.*/$key=placeholder/" beta.env
          done
      - name: Build and start
        run: $COMPOSE up -d --build --wait --wait-timeout 300
      - name: Through Caddy
        run: |
          curl -fsS http://127.0.0.1:3901/api/health | grep -q '"db":"ok"'
          curl -fsS http://127.0.0.1:3901/api/config | grep -q '"emailAccounts":false'
          curl -fsS http://127.0.0.1:3901/ | grep -q '<div id="root">'
      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color
      - name: Stop
        if: always()
        run: $COMPOSE down -v

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy -p rules-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace --all-features

  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: game
          POSTGRES_PASSWORD: game_dev_password
          POSTGRES_DB: game_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U game -d game_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://game:game_dev_password@localhost:5432/game_test
    steps:
      - uses: actions/checkout@v4
      # The rules engine is built to WebAssembly (packages/rules) before typecheck/tests.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Must match the wasm-bindgen crate version in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
